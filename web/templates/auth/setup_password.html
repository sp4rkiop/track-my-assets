<!DOCTYPE html>
<html lang="en" class="h-full bg-neutral-950 text-neutral-100 dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Setup - Fleet//OS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-mono-data {
            font-family: 'JetBrains Mono', monospace;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="h-full flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-8 shadow-2xl fade-in">

        <div class="text-center mb-8">
            <div class="text-emerald-500 font-bold tracking-widest text-2xl font-mono-data mb-2">INITIAL SETUP</div>
            <h1 class="text-lg font-semibold text-neutral-200">Secure Your Instance</h1>
            <p class="text-sm text-neutral-500 mt-1">The default admin password must be changed before accessing the
                Fleet//OS network.</p>
        </div>

        <form hx-post="/api/v1/auth/change-password" hx-swap="none" id="setupForm" class="space-y-5">

            <div>
                <label class="block text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2">New Access
                    Key</label>
                <input type="password" name="password" placeholder="Min 6 characters" required minlength="6"
                    class="w-full bg-neutral-950 border border-neutral-800 text-neutral-100 text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors font-mono-data placeholder-neutral-700">
            </div>

            <div>
                <label class="block text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-2">Confirm Access
                    Key</label>
                <input type="password" name="confirm_password" placeholder="Verify password" required minlength="6"
                    class="w-full bg-neutral-950 border border-neutral-800 text-neutral-100 text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors font-mono-data placeholder-neutral-700">
            </div>

            <button type="submit"
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-bold py-3 rounded-lg transition-colors mt-2 text-sm tracking-wide">
                APPLY & PROCEED &rarr;
            </button>

            <div id="setup-error-container"
                class="hidden mt-4 bg-red-500/10 border border-red-500/20 rounded-lg p-3 text-center">
                <span id="setup-error-text"
                    class="text-xs font-medium text-red-400 font-mono-data uppercase tracking-wider"></span>
            </div>
        </form>

        <script>
            // Listen for validation errors from HTMX
            document.body.addEventListener('htmx:responseError', function (evt) {
                const errorContainer = document.getElementById('setup-error-container');
                const errorText = document.getElementById('setup-error-text');

                errorContainer.classList.remove('hidden');

                try {
                    const response = JSON.parse(evt.detail.xhr.response);
                    errorText.innerText = "ERR: " + (response.detail || 'Validation Failed');
                } catch (e) {
                    errorText.innerText = "ERR: Unknown server error";
                }

                errorContainer.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
            });
        </script>
    </main>

</body>

</html>
