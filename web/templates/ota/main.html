<div class="fade-in space-y-6">
    <div>
        <h2 class="text-2xl font-bold text-neutral-100">OTA Fleet Management</h2>
        <p class="text-sm text-neutral-400 mt-1">Deploy firmware updates securely via the MQTT proxy.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6 shadow-sm">
            <h3 class="text-lg font-bold text-neutral-100 mb-4 flex items-center">
                <span class="w-2 h-2 rounded-full bg-amber-500 mr-2"></span> Canary Rollout
            </h3>

            <form hx-post="/web/ota/canary" hx-target="#jobs-container" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-neutral-400 uppercase tracking-wider mb-2">Target
                        Device</label>
                    <select name="device_id"
                        class="w-full bg-neutral-950 border border-neutral-700 rounded-lg p-2.5 text-sm text-neutral-200 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none">
                        {% for device in devices %}
                        <option value="{{ device.id }}">{{ device.name }} ({{ device.firmware_version or 'No FW Data'
                            }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-neutral-400 uppercase tracking-wider mb-2">Target
                        Firmware</label>
                    <select name="release_id"
                        class="w-full bg-neutral-950 border border-neutral-700 rounded-lg p-2.5 text-sm text-neutral-200 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 outline-none">
                        {% for release in releases %}
                        <option value="{{ release.id }}">{{ release.version }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit"
                    class="w-full bg-amber-500/10 text-amber-500 border border-amber-500/50 hover:bg-amber-500 hover:text-neutral-900 font-medium rounded-lg px-4 py-2.5 transition-colors">
                    Deploy to Canary
                </button>
            </form>
        </div>

        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6 shadow-sm">
            <h3 class="text-lg font-bold text-neutral-100 mb-4 flex items-center">
                <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span> Fleet Rollout
            </h3>
            <p class="text-xs text-neutral-400 mb-4">Pushes the selected firmware to all active devices meeting minimum
                requirements.</p>

            <form hx-post="/web/ota/fleet" hx-target="#jobs-container" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-neutral-400 uppercase tracking-wider mb-2">Target
                        Firmware</label>
                    <select name="release_id"
                        class="w-full bg-neutral-950 border border-neutral-700 rounded-lg p-2.5 text-sm text-neutral-200 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none">
                        {% for release in releases %}
                        <option value="{{ release.id }}">{{ release.version }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit"
                    class="w-full mt-auto bg-emerald-500/10 text-emerald-400 border border-emerald-500/50 hover:bg-emerald-500 hover:text-neutral-900 font-medium rounded-lg px-4 py-2.5 transition-colors">
                    Trigger Bulk Rollout
                </button>
            </form>
        </div>
    </div>

    <div class="mt-8">
        <div class="flex justify-between items-end mb-4">
            <h3 class="text-xl font-bold text-neutral-100">Active Deployments</h3>
            <div class="text-xs text-neutral-500 flex items-center">
                <span class="relative flex h-2 w-2 mr-2">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                </span>
                Polling Job Status...
            </div>
        </div>

        <div id="jobs-container" hx-get="/web/ota/jobs" hx-trigger="load, every 5s"
            class="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden shadow-sm">
        </div>
    </div>
</div>
